<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Sfondo bianco interno al cerchio più esterno -->
  <circle cx="50" cy="50" r="45" fill="#ffffff" />

  <!-- Anello esterno pieno -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#0066cc" stroke-width="7" />

  <!-- Anello interno pieno -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#0066cc" stroke-width="3" />

  <!-- Lettera P centrata -->
  <text x="50" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="52" fill="#0066cc" text-anchor="middle" dominant-baseline="central">P</text>
</svg>