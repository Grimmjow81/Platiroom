<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sfumatura metallica per il bordo circolare -->
    <linearGradient id="metal-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6a6a6" />
      <stop offset="30%" stop-color="#f2f2f2" />
      <stop offset="50%" stop-color="#737373" />
      <stop offset="75%" stop-color="#cccccc" />
      <stop offset="100%" stop-color="#595959" />
    </linearGradient>

    <!-- Sfumatura per lo sfondo interno con centro quasi bianco -->
    <radialGradient id="inner-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f4fd" />
      <stop offset="35%" stop-color="#3b99dc" />
      <stop offset="75%" stop-color="#0b3861" />
      <stop offset="100%" stop-color="#051c30" />
    </radialGradient>
  </defs>

  <!-- Sfondo interno circolare -->
  <circle cx="50" cy="50" r="41" fill="url(#inner-bg)" />

  <!-- Bordo circolare effetto metallico -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#metal-ring)" stroke-width="6" />

  <!-- Trofeo generico blu scuro al centro -->
  <g fill="#051930">
    <!-- Coppa principale -->
    <path d="M 33 27 
             L 67 27 
             C 67 48, 59 58, 50 58 
             C 41 58, 33 48, 33 27 Z" />

    <!-- Manico Sinistro -->
    <path d="M 33 30 
             C 21 30, 20 46, 35 48 
             C 26 46, 26 35, 33 35 Z" />

    <!-- Manico Destro -->
    <path d="M 67 30 
             C 79 30, 80 46, 65 48 
             C 74 46, 74 35, 67 35 Z" />

    <!-- Stelo / Gambo -->
    <rect x="46" y="58" width="8" height="11" rx="1" />

    <!-- Base del trofeo -->
    <path d="M 38 74 L 62 74 L 58 69 L 42 69 Z" />
  </g>
</svg>